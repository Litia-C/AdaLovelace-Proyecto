<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
</head>
<body>
    <form id="login-form">
        <div>
            <label for="email-input">Email:</label>
            <input id="email-input" name="email" type="email" required placeholder="Introduce tu correo"/>
        </div>
        <div>
            <label for="password-input">Contraseña:</label>
            <input id="password-input" name="password" type="password" required placeholder="Introduce tu contraseña"/>
        </div>
        <button type="submit">Iniciar Sesión</button>
    </form>
</body>
</html>
